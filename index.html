<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05090d">
<title>B_STREAMTV | Football Lives Here</title>

<style>
:root {
  --bg: #05090d;
  --card: #0a131c;
  --line: #20313e;
  --orange: #ff8b32;
  --orange-red: #ff6538;
  --red: #ff3045;
  --text: #f5f7fa;
  --muted: #a9b5c4;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding-bottom: 85px;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}
button, input { font: inherit; }
button { cursor: pointer; }
header {
  height: 70px;
  padding: 0 13px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: #05090df5;
  border-bottom: 1px solid var(--orange-red);
  position: sticky;
  top: 0;
  z-index: 5;
}
.icon {
  color: white;
  border: 0;
  background: none;
  font-size: 25px;
  padding: 5px;
}
.brand {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 6px;
}
.brand-b {
  color: var(--orange);
  font-weight: 1000;
  font-style: italic;
  font-size: 39px;
}
.brand-name {
  font-weight: 950;
  font-style: italic;
  font-size: 22px;
}
.brand-name span { color: var(--orange); }
.tagline {
  text-align: center;
  font-size: 8px;
  letter-spacing: 2px;
  color: #d5dce4;
}
.searchbox {
  margin: 12px;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: 24px;
  display: flex;
  gap: 10px;
  background: var(--card);
}
.searchbox input {
  flex: 1;
  min-width: 0;
  color: white;
  background: transparent;
  border: 0;
  outline: 0;
}
main { max-width: 700px; margin: auto; padding: 0 12px; }
.hero {
  margin: 13px 0;
  min-height: 190px;
  padding: 22px 17px;
  border: 1px solid var(--orange-red);
  border-radius: 18px;
  overflow: hidden;
  position: relative;
  background: linear-gradient(120deg, #100b09, #321609 60%, #09111a);
}
.hero:after {
  content: "⚽";
  position: absolute;
  right: -5px;
  bottom: -20px;
  font-size: 145px;
  opacity: .17;
}
.eyebrow {
  color: var(--orange);
  font-weight: 900;
  letter-spacing: 1px;
}
.hero h1 {
  position: relative;
  z-index: 1;
  max-width: 300px;
  margin: 9px 0;
  font-size: 34px;
  line-height: 1.04;
}
.hero h1 span { color: var(--orange); }
.leagues {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 7px;
  margin-bottom: 14px;
}
.league {
  min-height: 94px;
  padding: 6px 2px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--card);
  color: white;
  font-size: 10px;
  font-weight: 750;
}
.league b {
  display: block;
  font-size: 24px;
  margin-bottom: 7px;
}
.league.active { border-color: var(--orange); }
.section {
  padding: 12px 10px;
  margin-bottom: 13px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: linear-gradient(150deg, #0a131c, #05090d);
}
.section-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
.section-head h2 { font-size: 19px; margin: 0; flex: 1; }
.orange { color: var(--orange); }
.small-button {
  background: none;
  border: 0;
  color: var(--muted);
}
.filters { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 11px; }
.filter {
  white-space: nowrap;
  border: 1px solid var(--line);
  border-radius: 25px;
  padding: 8px 16px;
  color: white;
  background: #0b151e;
}
.filter.active {
  color: #190e07;
  background: linear-gradient(100deg, var(--orange-red), #ffad43);
  border-color: transparent;
  font-weight: 850;
}
.match {
  padding: 9px;
  margin-bottom: 8px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: #080f16;
}
.match-head {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  color: var(--muted);
}
.live-label {
  margin-left: auto;
  color: var(--red);
  font-weight: 900;
}
.clock {
  color: var(--orange);
  min-width: 43px;
  text-align: right;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.match-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 64px minmax(0, 1fr) 23px;
  align-items: center;
  gap: 4px;
  padding-top: 9px;
}
.team {
  display: flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
  font-size: 12px;
}
.team img {
  width: 29px;
  height: 29px;
  object-fit: contain;
  flex-shrink: 0;
}
.team span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.score {
  text-align: center;
  font-size: 21px;
  font-weight: 900;
  white-space: nowrap;
}
.star {
  border: 0;
  background: none;
  color: #b8c4d0;
  font-size: 22px;
  padding: 0;
}
.star.on { color: var(--orange); }
.today-row {
  display: grid;
  grid-template-columns: 44px minmax(0,1fr) 32px minmax(0,1fr) 20px;
  gap: 4px;
  align-items: center;
  padding: 10px 0;
  border-top: 1px solid var(--line);
  font-size: 11px;
}
.mini-team { display: flex; align-items: center; gap: 4px; min-width: 0; }
.mini-team img { width: 23px; height: 23px; object-fit: contain; }
.mini-team span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kickoff { font-size: 10px; color: var(--muted); }
.empty { padding: 22px 6px; text-align: center; color: var(--muted); font-size: 13px; }
.hidden { display: none !important; }
.bottom-nav {
  position: fixed;
  z-index: 10;
  bottom: 0;
  left: 0;
  right: 0;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding: 9px 5px calc(9px + env(safe-area-inset-bottom));
  background: #05090df7;
  border-top: 1px solid var(--line);
}
.nav-button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: var(--muted);
  background: none;
  border: 0;
  font-size: 10px;
}
.nav-button b { font-size: 22px; font-weight: 500; }
.nav-button.active { color: var(--orange); font-weight: 800; }
@media(min-width:650px) {
  body { padding-bottom: 20px; }
  .bottom-nav { display: none; }
  .hero h1 { font-size: 40px; }
}
@media(max-width:360px) {
  .brand-name { font-size: 19px; }
  .hero h1 { font-size: 28px; }
  .team { font-size: 10px; }
  .team img { width: 25px; height: 25px; }
  .match-row { grid-template-columns: minmax(0,1fr) 54px minmax(0,1fr) 20px; }
  .score { font-size: 18px; }
}
</style>
</head>

<body>
<header>
  <button class="icon" id="menuButton">☰</button>
  <div class="brand">
    <span class="brand-b">B</span>
    <div>
      <div class="brand-name">_STREAM<span>TV</span></div>
      <div class="tagline">FOOTBALL LIVES HERE</div>
    </div>
  </div>
  <button class="icon" id="searchButton">⌕</button>
  <button class="icon" id="soundButton" aria-label="Toggle goal sounds">🔔</button>
</header>

<div class="searchbox hidden" id="searchBox">
  <span>⌕</span>
  <input id="searchInput" placeholder="Search teams, leagues or matches">
</div>

<main>
  <section class="hero">
    <div class="eyebrow">TOP MATCHES</div>
    <h1>The Best Football <span>Live &amp; Free</span></h1>
  </section>

  <section class="leagues">
    <button class="league" data-league="Premier League"><b>♛</b>Premier<br>League</button>
    <button class="league" data-league="LaLiga"><b>🌈</b>LaLiga</button>
    <button class="league" data-league="Bundesliga"><b>🟥</b>Bundesliga</button>
    <button class="league" data-league="Serie A"><b>🔷</b>Serie A</button>
    <button class="league" data-league="Champions League"><b>⚽</b>Champions<br>League</button>
  </section>

  <section class="section" id="liveSection">
    <div class="section-head">
      <span class="orange">◉</span>
      <h2>Live Matches</h2>
      <button class="small-button" id="refreshButton">↻ Refresh</button>
    </div>
    <div class="filters">
      <button class="filter active" data-filter="All">All</button>
      <button class="filter" data-filter="Live">Live</button>
      <button class="filter" data-filter="Upcoming">Upcoming</button>
      <button class="filter" data-filter="Finished">Finished</button>
    </div>
    <div id="matches"><div class="empty">Loading live scores…</div></div>
  </section>

  <section class="section" id="todaySection">
    <div class="section-head">
      <span class="orange">▣</span><h2>Today’s Matches</h2>
    </div>
    <div id="today"><div class="empty">Loading fixtures…</div></div>
  </section>

  <section class="section hidden" id="extraSection">
    <div class="section-head"><span class="orange">⚽</span><h2 id="extraTitle">Matches</h2></div>
    <div id="extraContent"></div>
  </section>
</main>

<nav class="bottom-nav">
  <button class="nav-button active" data-view="Home"><b>⌂</b>Home</button>
  <button class="nav-button" data-view="Live"><b>◉</b>Live</button>
  <button class="nav-button" data-view="Highlights"><b>▷</b>Highlights</button>
  <button class="nav-button" data-view="Favorites"><b>♡</b>Favorites</button>
  <button class="nav-button" data-view="Search"><b>⌕</b>Search</button>
</nav>

<script>
const API = '/api/fixtures';
const $ = s => document.querySelector(s);

let matches = [];
let filter = 'All';
let leagueFilter = '';
let query = '';
let currentView = 'Home';
let clocks = {};
let previousScores = {};
let soundEnabled = false;
let audioContext = null;

const favoriteKey = 'bstv_favorites_v2';
const favorites = new Set(JSON.parse(localStorage.getItem(favoriteKey) || '[]'));

function getStatus(m) {
  return m.fixture?.status || m.status || {};
}
function getId(m) {
  return String((m.fixture || m).id || m.id || '');
}
function getTeam(m, side) {
  return m.teams?.[side] || m[side] || {};
}
function getLeague(m) {
  return m.league?.name || m.competition?.name || 'Football';
}
function getGoals(m) {
  const g = m.goals || m.score || {};
  return [g.home ?? null, g.away ?? null];
}
function isLive(m) {
  const s = getStatus(m);
  return ['1H','HT','2H','ET','BT','P','LIVE','INT'].includes(s.short)
    || (Number(s.elapsed) > 0 && !['FT','AET','PEN'].includes(s.short));
}
function isFinished(m) {
  return ['FT','AET','PEN'].includes(getStatus(m).short);
}
function isUpcoming(m) {
  return !isLive(m) && !isFinished(m);
}
function safeText(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  })[c]);
}
function getLogo(team) {
  return team.logo || team.crest || '';
}
function logoHTML(team) {
  const logo = getLogo(team);
  if (!logo) return '<span>⚽</span>';
  return `<img src="${safeText(logo)}" alt="" loading="lazy" onerror="this.style.display='none'">`;
}
function leagueIcon(name) {
  if (/premier/i.test(name)) return '♛';
  if (/laliga|la liga/i.test(name)) return '🌈';
  if (/bundes/i.test(name)) return '🟥';
  if (/serie a/i.test(name)) return '🔷';
  return '⚽';
}

/* Seconds are estimated from the API's reported elapsed minute.
   The provider's next response resets the base if its minute changes. */
function matchClock(m) {
  const s = getStatus(m);
  if (!isLive(m)) return isFinished(m) ? 'FT' : (s.long || '—');
  if (s.elapsed == null) return 'LIVE';

  const key = getId(m);
  const baseMinute = Number(s.elapsed) || 0;
  const baseExtra = Number(s.extra) || 0;
  const baseSeconds = baseMinute * 60 + baseExtra * 60;

  if (!clocks[key] || clocks[key].minute !== baseMinute) {
    clocks[key] = { minute: baseMinute, started: Date.now(), seconds: baseSeconds };
  }

  const total = clocks[key].seconds + Math.floor((Date.now() - clocks[key].started) / 1000);
  return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
}

/* A short two-tone alert; mobile browsers require user interaction first. */
function playGoalSound() {
  if (!soundEnabled) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!audioContext) audioContext = new Ctx();
    if (audioContext.state === 'suspended') audioContext.resume();

    [880, 1175].forEach((frequency, index) => {
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = 'sine';
      oscillator.frequency.value = frequency;
      gain.gain.setValueAtTime(0.0001, audioContext.currentTime + index * 0.13);
      gain.gain.exponentialRampToValueAtTime(0.22, audioContext.currentTime + index * 0.13 + 0.025);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + index * 0.13 + 0.28);
      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(audioContext.currentTime + index * 0.13);
      oscillator.stop(audioContext.currentTime + index * 0.13 + 0.3);
    });
  } catch (e) {
    console.warn('Goal sound unavailable', e);
  }
}

function detectGoals(newMatches) {
  for (const m of newMatches) {
    const key = getId(m);
    const g = getGoals(m);
    const score = `${g[0]}-${g[1]}`;
    if (previousScores[key] !== undefined && previousScores[key] !== score) {
      playGoalSound();
      if ('vibrate' in navigator) navigator.vibrate([150, 80, 150]);
      showToast(`⚽ GOAL! ${getTeam(m,'home').name || 'Home'} ${g[0]} - ${g[1]} ${getTeam(m,'away').name || 'Away'}`);
    }
    previousScores[key] = score;
  }
}

function showToast(message) {
  let toast = $('#toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.style.cssText = 'position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:30;background:#17232e;border:1px solid #ff8b32;border-radius:12px;padding:12px 15px;max-width:92%;font-size:13px;text-align:center;';
    document.body.appendChild(toast);
  }
  toast.textContent = message;
  toast.style.display = 'block';
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => toast.style.display = 'none', 3500);
}

function matchCard(m) {
  const home = getTeam(m,'home');
  const away = getTeam(m,'away');
  const g = getGoals(m);
  const key = getId(m);
  const name = getLeague(m);
  const label = isLive(m) ? '● LIVE' : (isFinished(m) ? 'FT' : 'UPCOMING');

  return `<article class="match">
    <div class="match-head">
      <span>${leagueIcon(name)}</span><span>${safeText(name)}</span>
      <span class="live-label">${label}</span>
      <span class="clock" data-clock="${safeText(key)}">${safeText(matchClock(m))}</span>
    </div>
    <div class="match-row">
      <div class="team">${logoHTML(home)}<span>${safeText(home.name || 'Home')}</span></div>
      <div class="score">${g[0] ?? '–'} - ${g[1] ?? '–'}</div>
      <div class="team">${logoHTML(away)}<span>${safeText(away.name || 'Away')}</span></div>
      <button class="star ${favorites.has(key) ? 'on' : ''}" data-fav="${safeText(key)}">${favorites.has(key) ? '★' : '☆'}</button>
    </div>
  </article>`;
}

function todayRow(m) {
  const home = getTeam(m,'home');
  const away = getTeam(m,'away');
  const g = getGoals(m);
  const date = (m.fixture || m).date || m.date;
  const time = date ? new Date(date).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false}) : '--:--';
  return `<div class="today-row">
    <div class="kickoff">${time}</div>
    <div class="mini-team">${logoHTML(home)}<span>${safeText(home.name || 'Home')}</span></div>
    <div>${isUpcoming(m) ? '–' : `${g[0] ?? 0}-${g[1] ?? 0}`}</div>
    <div class="mini-team">${logoHTML(away)}<span>${safeText(away.name || 'Away')}</span></div>
    <button class="star ${favorites.has(getId(m)) ? 'on' : ''}" data-fav="${safeText(getId(m))}">${favorites.has(getId(m)) ? '★' : '☆'}</button>
  </div>`;
}

function filterMatches() {
  return matches.filter(m => {
    if (filter === 'Live' && !isLive(m)) return false;
    if (filter === 'Upcoming' && !isUpcoming(m)) return false;
    if (filter === 'Finished' && !isFinished(m)) return false;
    if (leagueFilter && !getLeague(m).toLowerCase().includes(leagueFilter.toLowerCase())) return false;
    const text = `${getTeam(m,'home').name || ''} ${getTeam(m,'away').name || ''} ${getLeague(m)}`.toLowerCase();
    return !query || text.includes(query.toLowerCase());
  });
}

function render() {
  const list = filterMatches();
  $('#matches').innerHTML = list.slice(0, 40).map(matchCard).join('')
    || '<div class="empty">No matches found. Check the API connection or choose another filter.</div>';
  $('#today').innerHTML = list.filter(isUpcoming).slice(0, 10).map(todayRow).join('')
    || '<div class="empty">No upcoming matches available.</div>';
  bindFavorites();
}

function bindFavorites() {
  document.querySelectorAll('[data-fav]').forEach(button => {
    button.onclick = () => {
      const key = button.dataset.fav;
      if (favorites.has(key)) favorites.delete(key);
      else favorites.add(key);
      localStorage.setItem(favoriteKey, JSON.stringify([...favorites]));
      render();
      if (currentView === 'Favorites') showView('Favorites');
    };
  });
}

async function loadMatches() {
  try {
    const response = await fetch(API + '?live=all&_=' + Date.now(), {cache:'no-store'});
    if (!response.ok) throw new Error('Fixtures API returned ' + response.status);
    const data = await response.json();
    let received = Array.isArray(data) ? data : (data.response || data.fixtures || data.data || []);

    if (!received.length) {
      const date = new Date().toISOString().slice(0,10);
      const daily = await fetch(API + '?date=' + date + '&_=' + Date.now(), {cache:'no-store'});
      if (daily.ok) {
        const d = await daily.json();
        received = Array.isArray(d) ? d : (d.response || d.fixtures || d.data || []);
      }
    }

    detectGoals(received);
    matches = received;
    render();
  } catch (error) {
    $('#matches').innerHTML = '<div class="empty">Could not load scores. Your /api/fixtures backend must be working for live data.</div>';
    $('#today').innerHTML = '<div class="empty">Fixtures will appear when the API responds.</div>';
    console.error(error);
  }
}

function showView(view) {
  currentView = view;
  document.querySelectorAll('.nav-button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  $('#liveSection').classList.toggle('hidden', ['Highlights','Favorites','Search'].includes(view));
  $('#todaySection').classList.toggle('hidden', ['Highlights','Favorites','Search'].includes(view));
  $('#extraSection').classList.toggle('hidden', !['Highlights','Favorites','Search'].includes(view));

  if (view === 'Home') {
    filter = 'All'; leagueFilter = ''; render();
  } else if (view === 'Live') {
    filter = 'Live'; leagueFilter = ''; render();
  } else if (view === 'Highlights') {
    $('#extraTitle').textContent = 'Football Highlights';
    $('#extraContent').innerHTML = '<div class="empty">Connect a legitimate highlights source to show videos here.</div>';
  } else if (view === 'Favorites') {
    $('#extraTitle').textContent = 'Your Favorites';
    $('#extraContent').innerHTML = matches.filter(m => favorites.has(getId(m))).map(matchCard).join('')
      || '<div class="empty">Tap ☆ on a match to save it here.</div>';
    bindFavorites();
  } else if (view === 'Search') {
    $('#extraTitle').textContent = 'Search Football';
    $('#extraContent').innerHTML = '<div class="searchbox"><input id="pageSearch" placeholder="Search teams or leagues"></div>';
    const input = $('#pageSearch');
    input.value = query;
    input.oninput = () => {
      query = input.value;
      $('#liveSection').classList.remove('hidden');
      $('#todaySection').classList.add('hidden');
      $('#extraSection').classList.add('hidden');
      filter = 'All';
      render();
    };
  }
  window.scrollTo({top:0, behavior:'smooth'});
}

document.querySelectorAll('.nav-button').forEach(b => b.onclick = () => showView(b.dataset.view));
document.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => {
  filter = b.dataset.filter;
  document.querySelectorAll('[data-filter]').forEach(x => x.classList.toggle('active', x === b));
  render();
});
document.querySelectorAll('[data-league]').forEach(b => b.onclick = () => {
  leagueFilter = leagueFilter === b.dataset.league ? '' : b.dataset.league;
  document.querySelectorAll('[data-league]').forEach(x => x.classList.toggle('active', x === b && !!leagueFilter));
  render();
  $('#liveSection').scrollIntoView({behavior:'smooth'});
});

$('#searchButton').onclick = () => $('#searchBox').classList.toggle('hidden');
$('#searchInput').oninput = e => { query = e.target.value; render(); };
$('#refreshButton').onclick = loadMatches;
$('#soundButton').onclick = async () => {
  soundEnabled = !soundEnabled;
  $('#soundButton').textContent = soundEnabled ? '🔔' : '🔕';
  if (soundEnabled) {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) {
        audioContext = audioContext || new Ctx();
        await audioContext.resume();
        playGoalSound();
      }
      showToast('Goal sound alerts enabled');
    } catch (e) { showToast('Sound is not available in this browser'); }
  } else showToast('Goal sound alerts muted');
};
$('#menuButton').onclick = () => showToast('Use the bottom tabs to explore B_STREAMTV.');

loadMatches();
setInterval(loadMatches, 15000);
setInterval(() => {
  document.querySelectorAll('[data-clock]').forEach(el => {
    const m = matches.find(x => getId(x) === el.dataset.clock);
    if (m) el.textContent = matchClock(m);
  });
}, 1000);
</script>
